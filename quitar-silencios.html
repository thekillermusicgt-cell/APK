<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRTSync — Quitar silencios</title><style>body{font-family:system-ui;background:#0b0d12;color:#f2f4f8;max-width:760px;margin:40px auto;padding:20px}.panel{background:#151a24;border:1px solid #2a3345;border-radius:14px;padding:24px}label{display:block;margin:16px 0 6px}input,button{font:inherit;padding:10px;border-radius:8px}input[type=number]{width:100px}button{background:#6ee7b7;border:0;cursor:pointer;margin-top:18px}.muted{color:#aeb8c8}#status{margin-top:18px;white-space:pre-wrap}</style></head><body><div class="panel"><h1>Quitar silencios del audio</h1><p class="muted">Procesa el audio en tu navegador y descarga una copia sin silencios para usarla después en SRTSync.</p><label>Audio</label><input id="audio" type="file" accept="audio/*"><label>Silencio mínimo (segundos)</label><input id="minSilence" type="number" min="0.05" step="0.05" value="0.45"><label>Umbral (dB)</label><input id="threshold" type="number" min="-80" max="0" step="1" value="-42"><br><button id="process">Procesar audio</button><button id="download" disabled>Descargar audio sin silencios</button><div id="status"></div></div><script>
const $=s=>document.querySelector(s);let output=null;
function pcmToWav(channels,sampleRate){const length=channels[0].length,bytes=44+length*channels.length*2,buf=new ArrayBuffer(bytes),v=new DataView(buf);let p=0;const w=(s,n)=>{for(let i=0;i<n;i++)v.setUint8(p++,s.charCodeAt(i))};const u=n=>{v.setUint32(p,n,true);p+=4},h=n=>{v.setUint16(p,n,true);p+=2};w('RIFF',4);u(bytes-8);w('WAVE',4);w('fmt ',4);u(16);h(1);h(channels.length);u(sampleRate);u(sampleRate*channels.length*2);h(channels.length*2);h(16);w('data',4);u(length*channels.length*2);for(let i=0;i<length;i++)for(const c of channels){let x=Math.max(-1,Math.min(1,c[i]));h(x<0?x*0x8000:x*0x7fff)}return new Blob([buf],{type:'audio/wav'})}
$('#process').onclick=async()=>{const f=$('#audio').files[0];if(!f)return $('#status').textContent='Selecciona un audio.';try{$('#process').disabled=true;$('#download').disabled=true;$('#status').textContent='Analizando y quitando silencios...';const ac=new AudioContext(),data=await ac.decodeAudioData(await f.arrayBuffer()),sr=data.sampleRate,channels=Array.from({length:data.numberOfChannels},(_,c)=>data.getChannelData(c)),frame=Math.max(1,Math.floor(sr*0.01)),minFrames=Math.floor(sr*Number($('#minSilence').value)),amp=Math.pow(10,Number($('#threshold').value)/20),keep=[];let start=0;for(let i=0;i<data.length;i+=frame){let end=Math.min(data.length,i+frame),sum=0;for(let j=i;j<end;j++){let x=0;for(const c of channels)x+=Math.abs(c[j]);sum+=x/channels.length}let rms=sum/(end-i);if(rms>=amp){let a=Math.max(0,i-minFrames/4),b=Math.min(data.length,end+minFrames/4);keep.push([a,b])}}if(!keep.length)throw Error('No se encontró audio por encima del umbral.');let merged=[];for(const r of keep){if(merged.length&&r[0]<=merged.at(-1)[1]+minFrames)merged.at(-1)[1]=r[1];else merged.push(r)}let total=merged.reduce((n,r)=>n+r[1]-r[0],0),out=channels.map(()=>new Float32Array(total)),pos=0;for(const [a,b] of merged){for(let c=0;c<channels.length;c++)out[c].set(channels[c].subarray(a,b),pos);pos+=b-a}output=pcmToWav(out,sr);$('#download').disabled=false;$('#status').textContent=`Listo. Se eliminaron aproximadamente ${Math.max(0,data.duration-total/sr).toFixed(2)} s de silencio. Pulsa “Descargar” y usa ese archivo como audio en SRTSync.`;await ac.close()}catch(e){$('#status').textContent='Error: '+e.message}finally{$('#process').disabled=false}};$('#download').onclick=()=>{if(!output)return;const a=document.createElement('a');a.href=URL.createObjectURL(output);a.download='audio-sin-silencios.wav';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
